<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plugin Games Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    #search {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: #eee;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .game {
      background: #1b1b1b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
      position: relative;
    }
    .game img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .game-title {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .buy-link {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 4px;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .buy-link:hover {
      background: #2563eb;
    }
    .game::after {
      content: "skankhunt.sbs";
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      text-shadow: 1px 1px 2px #000;
      pointer-events: none;
    }
  </style>
</head>
<body>

<h1>Plugin Game Store</h1>

<div style="margin-bottom:20px; font-size:14px; color:#888; text-align:center;">
  <strong>Only authentic on skankhunt.sbs</strong> — all other sites are fakes.
</div>

<input type="text" id="search" placeholder="Search Game… (e.g. Minecraft, Halo)">

<div class="grid" id="games">

  <div class="game" data-title="Undisputed">
    <img src="Pics/undisputed.jpg" alt="Undisputed">
    <div class="game-title">Undisputed</div>
    <a class="buy-link" href="https://donate.stripe.com/eVq5kG2vE9zT5hD72L08g0h" target="_blank">
      Buy now
    </a>
  </div>

  

</div>

<script>
  const searchInput = document.getElementById('search');
  const games = document.querySelectorAll('.game');

  searchInput.addEventListener('input', () => {
    const query = searchInput.value.toLowerCase();
    games.forEach(game => {
      const title = game.dataset.title.toLowerCase();
      game.style.display = title.includes(query) ? 'block' : 'none';
    });
  });
</script>
</body>
</html>
